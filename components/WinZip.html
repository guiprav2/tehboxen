<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WinZip.html</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <script>
      // rootPrefix is the project's base URL, so the runtime loads from pages at any depth.
      window.rootPrefix = /^\/(files|preview)\//.test(location.pathname)
        ? location.pathname.split('/').slice(0, 4).join('/')
        : '/';
      for (let [src, module] of [
        ['webfoundry/ifdesigner.js', true],
        ['webfoundry/head.js', false],
      ]) {
        let s = document.createElement('script');
        s.src = rootPrefix.replace(/\/$/, '') + '/' + src;
        module ? (s.type = 'module') : (s.async = false);
        document.head.append(s);
      }
    </script>
  </head>
  <body
    class="flex flex-col [&amp;&gt;div:first-child]:flex-1 min-h-screen"
    style="display: none"
  >
    <div
      class="flex items-center justify-center min-h-[100dvh] p-8 bg-[#07100b]"
    >
      <div
        id="WinZip"
        class="flex flex-col overflow-hidden shadow-2xl shadow-amber-900/30 border border-white/40 bg-[#0d1117] text-zinc-200 w-[640px] h-[480px] shrink-0 rounded-3xl @container/app"
        wf-class="{{this.win.frameClass}}"
        wf-onclick="post('desktop.focusApp', this.winId)"
        wf-onattach="post('desktop.registerWindow', this.winId)"
      >
        <div
          class="h-10 shrink-0 flex items-center gap-2 px-3 bg-gradient-to-r from-amber-400 to-orange-400 text-white cursor-grab active:cursor-grabbing"
          wf-onpointerdown="post('desktop.startDrag', this.winId, event)"
        >
          <div
            class="size-6 rounded-md bg-zinc-900/20 flex items-center justify-center text-sm"
          >
            <i class="nf nf-md-zip_box"></i>
          </div>
          <div class="flex-1 text-sm font-semibold truncate">
            WinZip — {{this.s.isNew ? 'New Archive' : this.s.archivePath}}{{this.s.dirty ? ' •' : ''}}
          </div>
          <button
            class="size-7 rounded-full hover:bg-zinc-900/20 flex items-center justify-center max-md:hidden"
            wf-onclick="(event.stopPropagation(), post('desktop.minimizeApp', this.winId))"
            value=""
            wf-onpointerdown="event.stopPropagation()"
            title="Minimize"
          >
            <i class="nf text-xs nf-cod-chrome_minimize"></i>
          </button>
          <button
            class="size-7 rounded-full hover:bg-zinc-900/20 flex items-center justify-center max-md:hidden"
            wf-onclick="(event.stopPropagation(), post('desktop.toggleMaximize', this.winId))"
            value=""
            wf-onpointerdown="event.stopPropagation()"
            title="Maximize"
          >
            <i class="nf text-xs nf-cod-chrome_maximize"></i>
          </button>
          <button
            class="size-7 rounded-full hover:bg-red-500/80 flex items-center justify-center max-md:hidden"
            wf-onclick="(event.stopPropagation(), post('desktop.closeApp', this.winId))"
            value=""
            wf-onpointerdown="event.stopPropagation()"
            title="Close"
          >
            <i class="nf nf-md-close text-xs"></i>
          </button>
        </div>
        <div
          class="flex items-center gap-2 px-3 py-2 border-b border-amber-900 bg-zinc-900/80 flex-wrap gap-y-2"
        >
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-amber-900 hover:bg-amber-800"
            wf-onclick="this.post('newArchive')"
            value=""
            title="Start a new empty archive"
          >
            <i class="nf nf-md-file_plus"></i> New
          </button>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-amber-900 hover:bg-amber-800"
            wf-onclick="this.post('openFromSystem')"
            value=""
          >
            <i class="nf nf-md-folder_open"></i> Open…
          </button>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-amber-900 hover:bg-amber-800"
            wf-onclick="this.post('addFromSystem')"
            value=""
            title="Add a file (or drop files here)"
          >
            <i class="nf nf-md-plus"></i> Add…
          </button>
          <input
            class="w-40 min-w-0 rounded-lg border border-amber-800 px-2 py-1 text-xs bg-zinc-900"
            placeholder="archive name.zip"
            wf-if="this.s.isNew"
            wf-value="this.s.saveName"
            value=""
          />
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-emerald-400 hover:bg-emerald-500 text-white"
            wf-if="this.s.isNew || this.s.dirty"
            wf-onclick="this.post('save')"
            value=""
          >
            <i class="nf nf-md-content_save"></i> Save
          </button>
          <div class="w-px h-5 bg-amber-800"></div>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-amber-900 hover:bg-amber-800"
            wf-onclick="this.post('selectAll')"
            value=""
          >
            All
          </button>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-amber-900 hover:bg-amber-800"
            wf-onclick="this.post('selectNone')"
            value=""
          >
            None
          </button>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-red-900 hover:bg-red-800 text-red-300"
            wf-onclick="this.post('removeSelected')"
            value=""
          >
            Remove
          </button>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-orange-800 hover:bg-orange-700"
            wf-onclick="this.post('extractSelected')"
            value=""
          >
            Extract…
          </button>
          <button
            class="px-2 py-1 rounded-lg text-xs font-semibold bg-orange-700 hover:bg-orange-400 text-orange-50"
            wf-onclick="this.post('extractAll')"
            value=""
          >
            Extract all…
          </button>
        </div>
        <div
          class="text-xs text-amber-200 bg-amber-900/80 px-3 py-1.5"
          wf-if="this.s.warn"
        >
          {{this.s.warn}}
        </div>
        <div
          class="text-xs text-red-400 bg-red-950 px-3 py-1.5"
          wf-if="this.s.error"
        >
          {{this.s.error}}
        </div>
        <div class="text-xs text-zinc-500 px-3 py-2" wf-if="this.s.loading">
          Reading archive…
        </div>
        <div
          class="flex-1 min-h-0 overflow-y-auto p-2 bg-zinc-900/60 relative"
          wf-ondrop="this.post('drop', event)"
          wf-ondragleave="this.post('dragLeave', event)"
          wf-ondragover="this.post('dragOver', event)"
          wf-ondragenter="this.post('dragEnter', event)"
        >
          <div
            class="pointer-events-none absolute inset-2 z-20 rounded-2xl border-2 border-dashed border-amber-400 bg-amber-900/70 flex flex-col items-center justify-center gap-1 text-amber-200"
            wf-if="this.s.dragOver"
          >
            <i class="nf nf-md-zip_box text-3xl"></i>
            <div class="text-sm font-semibold">Drop to add to the archive</div>
          </div>
          <div
            class="h-full flex flex-col items-center justify-center gap-2 text-zinc-400 text-center px-6"
            wf-if="!this.s.entries.length &amp;&amp; !this.s.loading"
          >
            <i class="nf nf-md-zip_box_outline text-5xl text-amber-300"></i>
            <div class="text-sm font-semibold text-zinc-500">
              {{this.s.isNew ? 'New Archive' : 'This archive is empty'}}
            </div>
            <div class="text-xs">
              Drag files or folders here from Explorer, or use Add…
            </div>
          </div>
          <button
            class="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-left hover:bg-amber-950 border border-transparent"
            wf-map="e of this.s.entries"
            wf-class="{{this.s.selected[e.path] ? 'bg-amber-900 border-amber-700' : ''}}"
            wf-onclick="this.post('toggleSelect', e.path)"
            wf-ondblclick="this.post('openEntry', e.path)"
            value=""
          >
            <i
              class="nf text-lg"
              wf-class="{{this.s.selected[e.path] ? 'nf-md-checkbox_marked_outline text-amber-400' : 'nf-md-checkbox_blank_outline text-zinc-300'}}"
            ></i>
            <i class="nf nf-md-file_document text-sky-500 text-lg"></i>
            <div class="flex-1 min-w-0">
              <div class="text-sm font-medium truncate">{{e.name}}</div>
              <div class="text-[10px] text-zinc-400 truncate">
                {{e.dir ? e.dir + '/' : ''}}
              </div>
            </div>
          </button>
        </div>
        <div
          class="h-6 shrink-0 px-3 flex items-center text-[10px] text-zinc-500 border-t border-amber-900 bg-zinc-900/70 truncate"
        >
          {{this.s.status}}
        </div>
        <div
          class="absolute right-0 bottom-0 size-4 cursor-se-resize max-md:hidden"
          wf-onpointerdown="post('desktop.startResize', this.winId, 'se', event)"
        ></div>
        <div
          class="absolute top-10 right-0 bottom-4 w-1.5 cursor-e-resize z-10 max-md:hidden"
          wf-onpointerdown="post('desktop.startResize', this.winId, 'e', event)"
        ></div>
        <div
          class="absolute left-0 right-4 bottom-0 h-1.5 cursor-s-resize z-10 max-md:hidden"
          wf-onpointerdown="post('desktop.startResize', this.winId, 's', event)"
        ></div>
      </div>
    </div>
  </body>
</html>
